<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="officer_portal">Officer Dashboard - Smart Civic Connect</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Premium Styles -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <!-- Header Navigation -->
    <nav class="navbar navbar-expand-lg glass-nav sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <i class="bi bi-shield-check text-primary fs-3"></i>
                <span class="brand-font fw-bold" data-i18n="app_title">Smart Civic Connect</span>
            </a>
            <button class="navbar-toggler border-secondary text-light" type="button" data-bs-toggle="collapse" data-bs-target="#nav-content">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav-content">
                <div class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <button class="nav-link nav-link-custom active me-2 border-0 bg-transparent" id="tab-new-btn" onclick="switchFilter('Routed')">
                        <span data-i18n="status_New">New</span> / <span data-i18n="status_Routed">Routed</span>
                    </button>
                    <button class="nav-link nav-link-custom me-2 border-0 bg-transparent" id="tab-progress-btn" onclick="switchFilter('InProgress')" data-i18n="status_InProgress">In Progress</button>
                    <button class="nav-link nav-link-custom me-2 border-0 bg-transparent" id="tab-resolved-btn" onclick="switchFilter('Resolved')">Completed</button>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <div class="lang-toggle-container">
                        <button class="lang-btn active" data-lang="en">EN</button>
                        <button class="lang-btn" data-lang="te">తెలుగు</button>
                    </div>
                    <button class="btn btn-outline-danger btn-sm" onclick="logoutUser()" data-i18n="logout">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <!-- Profile Banner -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <h2 class="fw-bold" data-i18n="officer_portal">Officer Dashboard</h2>
                <p class="text-muted mb-0" id="welcome-message">Loading officer details...</p>
            </div>
            <div class="badge bg-primary p-2.5 fs-6 shadow-sm" id="dept-badge">
                <i class="bi bi-building me-1"></i> Department: --
            </div>
        </div>

        <div id="officer-alert" class="alert alert-success d-none alert-dismissible fade show" role="alert">
            <span id="alert-text"></span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
        </div>

        <!-- Complaints Listing Card Grid -->
        <div class="glass-card">
            <h4 class="fw-bold mb-4" id="assigned-issues-title" data-i18n="assigned_issues">Assigned Complaints</h4>
            
            <div class="row" id="officer-complaints-list">
                <div class="text-center py-5 text-muted col-12" id="list-loader">
                    <div class="spinner-border text-primary mb-3" role="status"></div>
                    <p class="mb-0">Loading assigned complaints...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Resolve Complaint Modal -->
    <div class="modal fade" id="resolveModal" data-bs-backdrop="static" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-secondary text-light border border-secondary">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title fw-bold" data-i18n="resolve_modal_title">Resolve Complaint</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="resolve-form">
                    <input type="hidden" id="resolve-complaint-id">
                    <div class="modal-body">
                        <!-- Upload Completed Photo -->
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-medium" data-i18n="resolve_photo_label">Upload Resolved Photo</label>
                            <input type="file" id="resolve-photo" class="form-control glass-input" accept="image/*" capture="camera" required>
                            <div id="resolve-preview-container" class="mt-3 d-none">
                                <img id="resolve-preview" src="#" alt="Preview" class="img-thumbnail bg-dark border-secondary" style="max-height: 180px;">
                            </div>
                        </div>
                        
                        <!-- Description/Notes -->
                        <div class="mb-2">
                            <label class="form-label text-muted small fw-medium" data-i18n="resolve_desc_label">Resolution Notes</label>
                            <textarea id="resolve-notes" class="form-control glass-input" rows="3" required data-i18n-placeholder="resolve_desc_placeholder"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-top border-secondary">
                        <button type="button" class="btn btn-outline-light btn-sm" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-premium btn-sm" id="btn-submit-resolution">
                            <span data-i18n="btn_submit_resolution">Submit Resolution</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase Compat SDK CDNs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

    <!-- Project Config & Scripts -->
    <script src="js/config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/officer.js"></script>
    
    <!-- Bootstrap Bundle JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Start Auth Guard on Officer Roles
        guardPage(["officer"]);
    </script>
</body>
</html>
